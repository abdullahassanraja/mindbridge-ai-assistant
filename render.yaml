services:
  - type: web
    name: mindbridge-ai-assistant
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_BASE64
        sync: false

  - type: web
    name: mindbridge-landing
    runtime: static
    plan: free
    staticPublishPath: ./widget
    buildCommand: "echo 'No build needed for static site'"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
